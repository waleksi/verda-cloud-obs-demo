grafana:
  plugins:
    - victoriametrics-metrics-datasource 1.0.1
    - victoriametrics-logs-datasource 0.34.0
    - yesoreyeram-infinity-datasource 4.1.6
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: VictoriaMetrics
          uid: victoriametrics
          type: victoriametrics-metrics-datasource
          access: proxy
          url: http://vmsingle.victoriametrics.svc:8428
          isDefault: true
        - name: VictoriaLogs
          uid: victorialogs
          type: victoriametrics-logs-datasource
          access: proxy
          url: http://vlsingle.victorialogs.svc:9428
        # For live Kueue workloads
        - name: Kubernetes API
          uid: kubernetes-api
          type: yesoreyeram-infinity-datasource
          access: proxy
          url: https://kubernetes.default.svc
          jsonData:
            auth_method: bearerToken
            allowedHosts:
              - https://kubernetes.default.svc
            tlsAuthWithCACert: true
          secureJsonData:
            bearerToken: $__env{K8S_API_TOKEN}
            tlsCACert: $__file{/var/run/secrets/kubernetes.io/serviceaccount/ca.crt}
  # Token for the Kubernetes API datasource
  envValueFrom:
    K8S_API_TOKEN:
      secretKeyRef:
        name: grafana-k8s-api-token
        key: token
  # Dashboards come from dashboards/*.json in this folder (see templates/dashboards.yaml)
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
  # Provisioned alert rules
  alerting:
    rules.yaml:
      apiVersion: 1
      groups:
        - orgId: 1
          name: batch-operations
          folder: alerts
          interval: 1m
          rules:
            - uid: kueue-job-pending-2m
              title: Kueue job pending for more than 2 minutes
              condition: C
              data:
                - refId: A
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: victoriametrics
                  model:
                    refId: A
                    expr: sum(kueue_pending_workloads) or vector(0)
                    instant: true
                    range: false
                - refId: B
                  datasourceUid: __expr__
                  model:
                    refId: B
                    type: reduce
                    expression: A
                    reducer: last
                - refId: C
                  datasourceUid: __expr__
                  model:
                    refId: C
                    type: threshold
                    expression: B
                    conditions:
                      - evaluator:
                          type: gt
                          params: [0]
              for: 2m
              noDataState: OK
              execErrState: Error
              labels:
                severity: warning
              annotations:
                summary: A Kueue workload has been Pending for more than 2 minutes
                description: At least one workload has been waiting in a Kueue queue without being admitted (for example because the ClusterQueue CPU quota is used up). See the Batch Operations dashboard.

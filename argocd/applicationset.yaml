apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/waleksi/verda-cloud-obs-demo.git
        revision: main
        directories:
          - path: argocd/addons/*
          - path: argocd/observability/*
  template:
    metadata:
      name: '{{path.basename}}'
    spec:
      project: '{{path[1]}}'
      source:
        repoURL: https://github.com/waleksi/verda-cloud-obs-demo.git
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path.basename}}'
      syncPolicy:
        automated:
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true

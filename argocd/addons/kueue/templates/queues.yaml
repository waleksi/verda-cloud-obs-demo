# using argocd sync waves to install them only after CRDs are installed
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: default-flavor
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: cluster-queue
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  namespaceSelector: {} 
  resourceGroups:
    - coveredResources: ["cpu"]
      flavors:
        - name: default-flavor
          resources:
            - name: cpu
              nominalQuota: "2"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: user-queue
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  clusterQueue: cluster-queue

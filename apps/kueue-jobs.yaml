apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kueue-jobs
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: apps
  source:
    repoURL: https://github.com/waleksi/verda-cloud-obs-demo.git
    targetRevision: main
    path: apps/kueue-jobs
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  # Kueue flips spec.suspend when it admits a Job.
  ignoreDifferences:
    - group: batch
      kind: Job
      jsonPointers:
        - /spec/suspend
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
